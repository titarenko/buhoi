name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  checks: write
  contents: write

jobs:
  lint:
    name: run linter
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      BUHOI_REDIS: redis://localhost
      BUHOI_MQ: amqp://guest:guest@localhost
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node.js dependencies
        run: npm ci --include=dev
      - name: Run ESLint
        run: npm run lint

